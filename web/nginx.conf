server {
    listen 80;
    server_name _;

    # Map + chat UI
    root /usr/share/nginx/html;
    index index.html;

    # Original geoportal page from KPI (rasters + SolarWindMaps.html in ./data/geoportal)
    location /maps/ {
        alias /srv/geoportal/;
    }

    # TiTiler, same origin as the page: /titiler/cog/... -> titiler:8000/cog/...
    location /titiler/ {
        proxy_pass http://titiler:8000/;
        proxy_set_header Host $http_host;
    }

    # n8n public webhooks only (chat trigger); the editor is not exposed here.
    location /n8n/webhook/ {
        proxy_pass http://n8n:5678/webhook/;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;   # agent runs can take a while
        proxy_buffering off;
    }
}
