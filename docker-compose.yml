services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows

  geo-api:
    build: .
    restart: unless-stopped
    ports:
      - "8020:8000"
    environment:
      TITILER_URL: http://titiler:8000/cog
      RASTER_DIR: /data/geoportal   # path as seen by the titiler container
    depends_on:
      - titiler
    volumes:
      - ./data:/data

  # Raster tile/point server for the geoportal and the agent's raster tools.
  # Rasters live in ./data/geoportal (gitignored), visible here as /data/geoportal.
  titiler:
    image: ghcr.io/developmentseed/titiler:2.4.0
    restart: unless-stopped
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8010:8000"
    volumes:
      - ./data/geoportal:/data/geoportal:ro

  # Map + agent chat UI at http://localhost:8080 (web/), original KPI page at /maps/.
  # nginx also proxies /titiler/ and n8n's public webhooks so the page is same-origin.
  geoportal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - titiler
      - n8n
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/geoportal:/srv/geoportal:ro

volumes:
  n8n_data:
